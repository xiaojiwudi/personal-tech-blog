<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隐藏层直觉演示</title>
<style>
:root {
  --bg: #ffffff;
  --tx: #1a1a18;
  --tx2: #6b6a65;
}
@media (prefers-color-scheme:dark) {
  :root {
    --bg: #1c1c1a;
    --tx: #eeecea;
    --tx2: #9c9a92;
  }
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background: var(--bg);
  color: var(--tx);
  padding: 16px;
}
.grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:900px; margin:0 auto; }
.panel { display:flex; flex-direction:column; align-items:center; gap:8px; }
.panel-title { font-size:15px; font-weight:600; color:var(--tx); }
.panel-sub { font-size:13px; color:var(--tx2); text-align:center; line-height:1.5; max-width:350px; }
canvas { border-radius:8px; border:1px solid rgba(128,128,128,0.2); width:100%; max-width:440px; height:auto; }
</style>
</head>
<body>

<div class="grid">
  <div class="panel">
    <div class="panel-title">没有隐藏层</div>
    <canvas id="c1"></canvas>
    <div class="panel-sub">只能画一条直线来分类，XOR 问题无法解决</div>
  </div>
  <div class="panel">
    <div class="panel-title">有隐藏层</div>
    <canvas id="c2"></canvas>
    <div class="panel-sub">决策边界可以弯曲成任意形状，轻松解决 XOR 和复杂问题</div>
  </div>
</div>

<script>
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const CW = 440, CH = 320;

function setupCanvas(id) {
  const c = document.getElementById(id);
  c.width = CW * DPR;
  c.height = CH * DPR;
  c.style.width = CW + 'px';
  c.style.height = CH + 'px';
  const ctx = c.getContext('2d');
  ctx.scale(DPR, DPR);
  return { c, ctx, W:CW, H:CH };
}

const isDark = matchMedia('(prefers-color-scheme:dark)').matches;
const purple = isDark ? '#AFA9EC' : '#534AB7';
const dotA   = isDark ? '#7F77DD' : '#3C3489';
const dotB   = isDark ? '#1D9E75' : '#085041';
const bgA    = isDark ? 'rgba(224,75,74,0.13)' : 'rgba(224,75,74,0.07)';
const bgB    = isDark ? 'rgba(29,158,117,0.13)' : 'rgba(29,158,117,0.07)';
const txt    = isDark ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.28)';

{
  const {ctx, W, H} = setupCanvas('c1');
  ctx.fillStyle = bgA; ctx.fillRect(0, 0, W, H/2+30);
  ctx.fillStyle = bgB; ctx.fillRect(0, H/2+30, W, H/2-30);

  // Decision boundary
  ctx.strokeStyle = '#E24B4A'; ctx.lineWidth = 2; ctx.setLineDash([8,5]);
  ctx.beginPath(); ctx.moveTo(0, H/2+30); ctx.lineTo(W, H/2+30); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = txt; ctx.font = '13px sans-serif';
  ctx.fillText('类别 A', 14, 24);
  ctx.fillText('类别 B', 14, H-14);

  const ptsA = [[80,60],[180,50],[280,90],[100,120],[220,100],[320,55],[160,80]];
  const ptsB = [[60,200],[160,240],[270,190],[110,260],[230,250],[320,210],[180,220]];
  const wrong = [[90,165],[260,175]];

  ptsA.forEach(([x,y])=>{ ctx.fillStyle=dotA; ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill(); });
  ptsB.forEach(([x,y])=>{ ctx.fillStyle=dotB; ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill(); });
  wrong.forEach(([x,y])=>{
    ctx.fillStyle='#E24B4A'; ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#E24B4A'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x-6,y-6); ctx.lineTo(x+6,y+6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+6,y-6); ctx.lineTo(x-6,y+6); ctx.stroke();
  });
  ctx.fillStyle='#E24B4A'; ctx.font='bold 12px sans-serif';
  ctx.fillText('分类错误', 262, 180);
}

{
  const {ctx, W, H} = setupCanvas('c2');
  const cx = W/2, cy = H/2;

  // Draw colored decision regions
  const imgData = ctx.createImageData(W, H);
  for(let px=0; px<W; px++){
    for(let py=0; py<H; py++){
      const dx=(px-cx)/(W/3.5), dy=(py-cy)/(H/3.5);
      const isA = (dx*dx + dy*dy < 1.2);
      const i=(py*W+px)*4;
      if(isA){
        imgData.data[i]=isDark?127:83; imgData.data[i+1]=isDark?119:52; imgData.data[i+2]=isDark?221:137; imgData.data[i+3]=40;
      } else {
        imgData.data[i]=isDark?29:15; imgData.data[i+1]=isDark?158:110; imgData.data[i+2]=isDark?117:86; imgData.data[i+3]=40;
      }
    }
  }
  ctx.putImageData(imgData,0,0);

  // Curved boundary
  ctx.strokeStyle = purple; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(cx, cy, Math.min(W,H)/3.2, 0, Math.PI*2); ctx.stroke();

  const inner = [[cx-60,cy-20],[cx+30,cy-50],[cx-50,cy+40],[cx+50,cy+20],[cx-20,cy+60],[cx+70,cy+50]];
  const outer = [[30,30],[W-30,30],[30,H-30],[W-30,H-30],[70,H/2],[W-70,H/2],[cx,25],[cx,H-25]];

  inner.forEach(([x,y])=>{ ctx.fillStyle=dotA; ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill(); });
  outer.forEach(([x,y])=>{ ctx.fillStyle=dotB; ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill(); });

  ctx.fillStyle = txt; ctx.font = '13px sans-serif';
  ctx.fillText('弯曲的决策边界', 14, H-14);
}
</script>
</body>
</html>
