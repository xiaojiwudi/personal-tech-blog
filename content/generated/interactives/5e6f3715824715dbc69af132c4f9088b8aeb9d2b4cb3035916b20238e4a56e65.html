<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单神经元交互演示</title>
<style>
:root {
  --color-text-primary: #1a1a18;
  --color-text-secondary: #6b6a65;
  --color-text-info: #0c447c;
  --color-background-info: #e6f1fb;
  --color-border-secondary: rgba(0,0,0,0.22);
  --color-border-info: rgba(55,138,221,0.4);
  --color-border-tertiary: rgba(0,0,0,0.10);
  --border-radius-md: 8px;
  --font-mono: 'Menlo','Monaco','Courier New',monospace;
}
@media (prefers-color-scheme:dark) {
  :root {
    --color-text-primary: #eeecea;
    --color-text-secondary: #9c9a92;
    --color-text-info: #85b7eb;
    --color-background-info: #0c2540;
    --color-border-secondary: rgba(255,255,255,0.22);
    --color-border-info: rgba(133,183,235,0.4);
    --color-border-tertiary: rgba(255,255,255,0.10);
  }
}
body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; margin:0; padding:20px; }
.ctrl { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:13px; color:var(--color-text-secondary); }
.ctrl label { width:60px; flex-shrink:0; }
.ctrl input[type=range] { flex:1; accent-color:#7F77DD; }
.ctrl .val { width:44px; text-align:right; font-weight:500; color:var(--color-text-primary); font-size:13px; font-family:var(--font-mono); }
.neuron-out { font-size:28px; font-weight:500; color:var(--color-text-primary); }
.act-btn { font-size:12px; padding:4px 10px; border-radius:var(--border-radius-md); border:0.5px solid var(--color-border-secondary); background:transparent; color:var(--color-text-secondary); cursor:pointer; }
.act-btn.active { background:var(--color-background-info); color:var(--color-text-info); border-color:var(--color-border-info); }
</style>
</head>
<body>
<svg width="100%" viewBox="0 0 680 210" role="img">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g>
    <rect x="40" y="62" width="72" height="36" rx="6" stroke="var(--color-border-tertiary)" stroke-width="0.5" fill="none"/>
    <text font-size="13" fill="var(--color-text-primary)" x="76" y="80" text-anchor="middle" dominant-baseline="central">x₁</text>
  </g>
  <g>
    <rect x="40" y="112" width="72" height="36" rx="6" stroke="var(--color-border-tertiary)" stroke-width="0.5" fill="none"/>
    <text font-size="13" fill="var(--color-text-primary)" x="76" y="130" text-anchor="middle" dominant-baseline="central">x₂</text>
  </g>
  <line x1="112" y1="80" x2="230" y2="105" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="112" y1="130" x2="230" y2="105" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>
  <text font-size="11" id="lbl-w1" x="165" y="82" text-anchor="middle" fill="#534AB7">w₁=0.50</text>
  <text font-size="11" id="lbl-w2" x="165" y="140" text-anchor="middle" fill="#534AB7">w₂=0.50</text>
  <g>
    <circle cx="270" cy="105" r="38" stroke="#7F77DD" stroke-width="0.5" fill="none"/>
    <text font-size="11" id="lbl-z" x="270" y="98" text-anchor="middle" fill="var(--color-text-secondary)">z=0.75</text>
    <text font-size="13" id="lbl-a" x="270" y="116" text-anchor="middle" fill="var(--color-text-primary)">σ(z)</text>
  </g>
  <text font-size="11" id="lbl-b" x="270" y="160" text-anchor="middle" fill="var(--color-text-secondary)">b=0.25</text>
  <line x1="308" y1="105" x2="390" y2="105" stroke="#1D9E75" stroke-width="2" marker-end="url(#arr)"/>
  <g>
    <rect x="390" y="80" width="80" height="50" rx="8" stroke="#1D9E75" stroke-width="0.5" fill="none"/>
    <text font-size="11" x="430" y="97" text-anchor="middle" fill="var(--color-text-secondary)">output</text>
    <text font-size="13" id="lbl-out" x="430" y="117" text-anchor="middle" fill="var(--color-text-primary)">0.679</text>
  </g>
  <text font-size="11" x="76" y="56" text-anchor="middle" fill="var(--color-text-secondary)">输入</text>
  <text font-size="11" x="270" y="52" text-anchor="middle" fill="var(--color-text-secondary)">神经元</text>
  <text font-size="11" x="430" y="66" text-anchor="middle" fill="var(--color-text-secondary)">输出</text>
</svg>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;margin-top:4px;">
  <div>
    <div class="ctrl"><label>x₁</label><input type="range" id="x1" min="-2" max="2" step="0.1" value="0.5"><span class="val" id="v-x1">0.5</span></div>
    <div class="ctrl"><label>x₂</label><input type="range" id="x2" min="-2" max="2" step="0.1" value="1.0"><span class="val" id="v-x2">1.0</span></div>
    <div class="ctrl"><label>w₁</label><input type="range" id="w1" min="-2" max="2" step="0.1" value="0.5"><span class="val" id="v-w1">0.5</span></div>
    <div class="ctrl"><label>w₂</label><input type="range" id="w2" min="-2" max="2" step="0.1" value="0.5"><span class="val" id="v-w2">0.5</span></div>
    <div class="ctrl"><label>bias b</label><input type="range" id="bias" min="-2" max="2" step="0.1" value="0.25"><span class="val" id="v-b">0.25</span></div>
  </div>
  <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;">
    <div style="font-size:13px;color:var(--color-text-secondary)">激活函数</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
      <button class="act-btn active" id="btn-sigmoid" onclick="setAct('sigmoid')">Sigmoid</button>
      <button class="act-btn" id="btn-relu" onclick="setAct('relu')">ReLU</button>
      <button class="act-btn" id="btn-tanh" onclick="setAct('tanh')">Tanh</button>
    </div>
    <div style="text-align:center;">
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">输出 a = σ(z)</div>
      <div class="neuron-out" id="out-big">0.679</div>
    </div>
  </div>
</div>
<script>
let act = 'sigmoid';
function sigmoid(z){ return 1/(1+Math.exp(-z)); }
function relu(z){ return Math.max(0,z); }
function tanh_(z){ return Math.tanh(z); }
function apply(z){ return act==='sigmoid'?sigmoid(z):act==='relu'?relu(z):tanh_(z); }
function setAct(a){
  act=a;
  ['sigmoid','relu','tanh'].forEach(k=>{
    document.getElementById('btn-'+k).classList.toggle('active',k===a);
  });
  update();
}
function update(){
  const x1=+document.getElementById('x1').value;
  const x2=+document.getElementById('x2').value;
  const w1=+document.getElementById('w1').value;
  const w2=+document.getElementById('w2').value;
  const b=+document.getElementById('bias').value;
  document.getElementById('v-x1').textContent=x1.toFixed(1);
  document.getElementById('v-x2').textContent=x2.toFixed(1);
  document.getElementById('v-w1').textContent=w1.toFixed(1);
  document.getElementById('v-w2').textContent=w2.toFixed(1);
  document.getElementById('v-b').textContent=b.toFixed(2);
  const z=w1*x1+w2*x2+b;
  const a=apply(z);
  document.getElementById('lbl-w1').textContent='w₁='+w1.toFixed(2);
  document.getElementById('lbl-w2').textContent='w₂='+w2.toFixed(2);
  document.getElementById('lbl-b').textContent='b='+b.toFixed(2);
  document.getElementById('lbl-z').textContent='z='+z.toFixed(2);
  document.getElementById('lbl-a').textContent=act+'(z)';
  document.getElementById('lbl-out').textContent=a.toFixed(3);
  document.getElementById('out-big').textContent=a.toFixed(3);
}
['x1','x2','w1','w2','bias'].forEach(id=>document.getElementById(id).addEventListener('input',update));
update();
</script>
</body>
</html>
