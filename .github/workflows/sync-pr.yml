name: Open content sync PR

on:
  push:
    branches: [bot/kb-sync]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git fetch origin main
      - name: Build trusted PR description
        run: node scripts/sync-pr-body.mjs > "$RUNNER_TEMP/pr-body.md"
      - name: Create or update sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --head bot/kb-sync --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore(content): sync robot-kb" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head bot/kb-sync --title "chore(content): sync robot-kb" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
